[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infinity-workbench"
version = "1.0.0"
description = "Local, single-user synthetic biology workbench built with Streamlit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Infinity Workbench contributors"}]
keywords = ["synthetic-biology", "streamlit", "bioinformatics", "local-first"]
dependencies = [
  "streamlit==1.67.0",
  "pandas==3.1.1",
  "numpy==2.4.6",
  "matplotlib==3.11.2",
  "biopython==1.88",
  "jinja2==3.1.6",
  "openpyxl==3.1.5",
  "pillow==13.0.0",
  "biotite==1.6.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
pdf = ["weasyprint==68.1"]
metabolism = ["cobra==0.32.1"]

[tool.setuptools]
py-modules = ["app"]
packages = ["core", "adapters", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --basetemp=workspace/tmp/pytest"
markers = [
  "slow: tests that invoke optional external tools",
  "ui: Streamlit AppTest smoke tests",
]
# Keep every temporary file inside the project root.
cache_dir = "workspace/tmp/pytest-cache"
tmp_path_retention_policy = "failed"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "workspace", ".tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]